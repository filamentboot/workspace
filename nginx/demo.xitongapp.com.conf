# =============================================================================
# nginx vhost 模板：demo.xitongapp.com
# 用途：Filamentboot 演示站（过渡域名，D-03）
# 服务器：118.25.27.49（腾讯云 Debian 12）
# 应用目录：/data/filamentboot/public
# SSL：acme.sh（Let's Encrypt）
#
# 部署步骤（由 scripts/migrate-server.sh 自动执行）：
#   1. cp nginx/demo.xitongapp.com.conf /etc/nginx/conf.d/demo.xitongapp.com.conf
#   2. 申请证书：acme.sh --issue -d demo.xitongapp.com --webroot /data/filamentboot/public
#   3. nginx -t && systemctl reload nginx
# =============================================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name demo.xitongapp.com;

    # Let's Encrypt ACME challenge（acme.sh --webroot 模式）
    location /.well-known/acme-challenge/ {
        root /data/filamentboot/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name demo.xitongapp.com;

    # ==========================================================================
    # SSL 证书（由 acme.sh 管理）
    # 申请命令：
    #   /root/.acme.sh/acme.sh --issue -d demo.xitongapp.com --webroot /data/filamentboot/public
    #   /root/.acme.sh/acme.sh --install-cert -d demo.xitongapp.com \
    #     --cert-file /etc/nginx/ssl/demo.xitongapp.com.crt \
    #     --key-file /etc/nginx/ssl/demo.xitongapp.com.key \
    #     --reloadcmd "systemctl reload nginx"
    # ==========================================================================
    ssl_certificate     /etc/nginx/ssl/demo.xitongapp.com.crt;
    ssl_certificate_key /etc/nginx/ssl/demo.xitongapp.com.key;

    # SSL 最佳实践
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    # 应用根目录（Laravel public/）
    root /data/filamentboot/public;
    index index.php;

    # 字符集
    charset utf-8;

    # 日志
    access_log /var/log/nginx/demo.xitongapp.com.access.log combined;
    error_log  /var/log/nginx/demo.xitongapp.com.error.log warn;

    # 安全头
    add_header X-Frame-Options            "SAMEORIGIN"           always;
    add_header X-Content-Type-Options     "nosniff"              always;
    add_header X-XSS-Protection           "1; mode=block"        always;
    add_header Referrer-Policy            "strict-origin"        always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Laravel URL 路由（前端控制器模式）
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM（PHP 8.4）
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # 静态资源缓存（Vite 构建产物含 hash，长缓存安全）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # 禁止访问 .git 等隐藏目录
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问 .env 文件
    location ~ /\.env {
        deny all;
    }

    # ACME challenge（HTTPS 下亦放行）
    location /.well-known/acme-challenge/ {
        root /data/filamentboot/public;
    }

    # 最大上传大小
    client_max_body_size 64M;
}
