name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  subtree-split:
    runs-on: ubuntu-latest

    outputs:
      TAG: ${{ steps.tag.outputs.TAG }}

    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: filamentboot,                repo: filamentboot }
          - { dir: filamentboot-cos,             repo: filamentboot-cos }
          - { dir: filamentboot-oss,             repo: filamentboot-oss }
          - { dir: filamentboot-rich-editor,     repo: filamentboot-rich-editor }
          - { dir: filamentboot-markdown-editor, repo: filamentboot-markdown-editor }
          - { dir: filamentboot-wang-editor,     repo: filamentboot-wang-editor }
          - { dir: filamentboot-site,            repo: filamentboot-site }

    steps:
      - name: 检出完整历史（splitsh-lite 强制要求）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 获取 Tag 名称
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 安装 splitsh-lite v1.0.1
        run: |
          curl -sL https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz | tar xz
          sudo mv splitsh-lite /usr/local/bin/splitsh-lite

      - name: Split 并推送 ${{ matrix.package.repo }}
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          PREFIX="packages/${{ matrix.package.dir }}"
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/filamentboot/${{ matrix.package.repo }}.git"
          SHA=$(splitsh-lite --prefix="$PREFIX")
          git remote add split-target "$REPO" 2>/dev/null || true
          git push split-target "${SHA}:refs/heads/main" --force
          git push split-target "${SHA}:refs/tags/${TAG}" --force

  release:
    runs-on: ubuntu-latest
    needs: subtree-split

    outputs:
      TAG: ${{ steps.tag.outputs.TAG }}

    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 Tag 名称
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 提取 CHANGELOG 版本说明（版本号过滤版）
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          VER="${TAG#v}"
          awk -v ver="$VER" '
            /^## \[/{
              if(found) exit
              if(index($0, "[" ver "]")) found=1
              next
            }
            found{print}
          ' packages/filamentboot/CHANGELOG.md > /tmp/release-notes.md
          echo "=== Release Notes 预览 ==="
          cat /tmp/release-notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          gh release create "$TAG" \
            --repo filamentboot/filamentboot \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

  mirror-to-gitee:
    runs-on: ubuntu-latest
    needs: subtree-split

    strategy:
      fail-fast: false
      matrix:
        repo:
          - filamentboot
          - filamentboot-cos
          - filamentboot-oss
          - filamentboot-rich-editor
          - filamentboot-markdown-editor
          - filamentboot-wang-editor
          - filamentboot-site
          - workspace

    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 镜像 ${{ matrix.repo }} 到 Gitee
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@gitee.com:filamentboot/${{ matrix.repo }}.git
          ssh_private_key: ${{ secrets.GITEE_SSH_KEY }}

  verify:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: 验证包仓库 tag 存在（主验证）
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}
        run: |
          TAG=${{ needs.release.outputs.TAG }}
          gh api "repos/filamentboot/filamentboot/git/refs/tags/$TAG"
          echo "包仓库 tag $TAG 已确认存在"

      - name: 等待 Packagist 同步并验证（warning-only，外部状态不阻塞）
        run: |
          TAG=${{ needs.release.outputs.TAG }}
          VER="${TAG#v}"
          echo "等待 Packagist 同步（初始等待 60s）..."
          sleep 60
          for i in 1 2 3 4 5; do
            if curl -sf "https://packagist.org/p2/filamentboot/filamentboot.json" | \
               python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          vs = [p['version'] for p in d['packages']['filamentboot/filamentboot']]
          exit(0 if 'v$VER' in vs else 1)
          " 2>/dev/null; then
              echo "Packagist 已收录 v$VER"
              exit 0
            fi
            echo "尝试 $i/5，等待 30s..."
            sleep 30
          done
          echo "::warning::Packagist 在 4 分钟内未收录 $TAG，请手动检查 https://packagist.org/packages/filamentboot/filamentboot"
          exit 0
