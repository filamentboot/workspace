name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: filamentboot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: ${{ secrets.CI_APP_KEY }}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: filamentboot_test
      DB_USERNAME: root
      DB_PASSWORD: root
      BCRYPT_ROUNDS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: cp .env.example .env

      - run: php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # 构建前端资源，生成 public/build/manifest.json，
      # 否则渲染 Filament/Blade 视图的 Feature 测试会抛 ViteManifestNotFoundException
      - run: npm run build

      - run: composer test

      - run: composer phpstan

      - run: composer pint:test

      - name: 安全审计（仅警告，不阻塞 CI）
        run: composer audit --abandoned=report --no-interaction
        continue-on-error: true
