name: 功能建议
description: 建议一个新特性或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "欢迎提交功能建议！"
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 描述你当前遇到的痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
  - type: dropdown
    id: priority
    attributes:
      label: 你认为优先级如何？
      options:
        - 高（影响核心功能）
        - 中（影响日常使用）
        - 低（锦上添花）
