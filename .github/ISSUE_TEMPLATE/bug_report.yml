name: Bug 报告
description: 报告一个问题帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢你提交 Bug 报告！请尽量填写完整信息，以便我们快速复现和修复。"
  - type: input
    id: version
    attributes:
      label: Filamentboot 版本
      placeholder: "例如：v1.0.0 或 commit hash"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到了什么问题
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 出现 '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: |
        - PHP 版本：
        - Laravel 版本：
        - 操作系统：
        - 浏览器（如适用）：
